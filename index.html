function openShiftEditor(shift){const n=!shift,s=shift||{name:'',time_label:'',notice:'',capacity:50};showModal(n?'Crear nuevo turno':'Modificar turno','<div class="grid"><p class="confirm-text">'+(n?'Define los datos del nuevo turno.':'Actualiza los datos del turno.')+'</p><div><label>Nombre *</label><input id="shiftName" value="'+esc(s.name)+'"></div><div><label>Horario *</label><input id="shiftTime" value="'+esc(s.time_label)+'"></div><div><label>Aviso</label><input id="shiftNotice" value="'+esc(s.notice||'')+'"></div><div><label>Capacidad *</label><input id="shiftCapacity" type="number" min="1" value="'+(s.capacity??50)+'"></div><div id="shiftMsg"></div><button class="btn" id="saveShiftBtn">'+(n?'Crear turno':'Guardar cambios')+'</button></div>');$('saveShiftBtn').onclick=async()=>{const b=$('saveShiftBtn'),msg=$('shiftMsg'),name=$('shiftName').value.trim(),time=$('shiftTime').value.trim(),notice=$('shiftNotice').value.trim(),cap=Number($('shiftCapacity').value);b.disabled=true;try{const r=n?await db.rpc('admin_create_shift',{p_name:name,p_time_label:time,p_notice:notice||null,p_capacity:cap}):await db.rpc('admin_update_shift',{p_shift_id:shift.id,p_name:name,p_time_label:time,p_notice:notice||null,p_capacity:cap});if(r.error)throw r.error;closeModal();await refreshShiftData();await renderAdmin()}catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>';b.disabled=false}}}async function refreshShiftData(){const[s,r]=await Promise.all([db.from('shifts').select('*').order('id'),db.rpc('get_shift_counts')]);if(s.error)throw s.error;if(r.error)throw r.error;shifts=s.data||[];counts={};(r.data||[]).forEach(x=>counts[x.shift_id]=Number(x.occupied));render()}async function adminAction(e){const b=e.target.closest('[data-action]');if(!b)return;try{if(b.dataset.action==='delete'){if(!confirm('¿Eliminar este voluntario y todas sus inscripciones?'))return;const r=await db.rpc('admin_delete_volunteer',{p_volunteer_id:b.dataset.id});if(r.error)throw r.error;await renderAdmin()}else{const opts=shifts.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' — '+esc(s.time_label)+'</option>').join('');showModal('Cambiar turno','<div class="grid"><select id="newShift">'+opts+'</select><div id="changeMsg"></div><button class="btn" id="changeBtn">Guardar cambio</button></div>');$('changeBtn').onclick=async()=>{const r=await db.rpc('admin_manage_registration',{p_registration_id:b.dataset.id,p_new_shift_id:Number($('newShift').value)});if(r.error){$('changeMsg').innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}closeModal();await renderAdmin()}}}catch(err){alert(err.message)}}function exportExcel(){const rows=[['Turno','Horario','Nombre','Congregación','Teléfono','Edad']];document.querySelectorAll('.shiftgroup').forEach(g=>{const t=g.querySelector('h3')?.textContent||'',time=g.querySelector('.shiftgrouphead .meta')?.textContent||'';g.querySelectorAll('.volrow').forEach(r=>{const c=r.querySelectorAll('.volname,.phone,.age');rows.push([t,time,c[0]?.textContent||'',r.querySelector('.meta')?.textContent||'',c[1]?.textContent||'',c[2]?.textContent?.replace('Edad: ','')||''])})});const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Voluntarios');XLSX.writeFile(wb,'voluntarios_estacionamiento.xlsx')} (async()=>{await Promise.all([loadConfig(),load()])})();
</script></body></html>
