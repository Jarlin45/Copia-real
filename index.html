async function openCongregations(){const r=await db.from('congregations').select('*').order('id');congs=r.data||[];showModal('Congregaciones','<div class="grid">'+congs.map(c=>'<div class="cong-card"><div><b>'+esc(c.name)+'</b><div class="meta">'+(c.active?'Activa':'Inactiva')+'</div></div><div class="actions"><button class="btn small" data-edit-cong="'+c.id+'">Editar</button></div></div>').join('')+'<hr>'+field('Nueva congregación','newCong')+'<button class="btn" id="addCong">Agregar</button></div>');$('addCong').onclick=async()=>{const r=await db.rpc('admin_add_congregation',{p_name:$('newCong').value.trim()});if(r.error)alert(r.error.message);await openCongregations();await load()};$('modalBody').onclick=async e=>{const b=e.target.closest('[data-edit-cong]');if(!b)return;const c=congs.find(x=>x.id==b.dataset.editCong);showModal('Editar congregación',field('Nombre','cg_name',c.name)+'<label><input id="cg_active" type="checkbox" '+(c.active?'checked':'')+'> Activa</label><button class="btn" id="saveCong">Guardar</button>');$('saveCong').onclick=async()=>{const r=await db.rpc('admin_update_congregation',{p_id:c.id,p_name:$('cg_name').value.trim(),p_active:$('cg_active').checked});if(r.error)alert(r.error.message);await openCongregations();await load()}}}
function openShiftForm(s=null){showModal(s?'Editar turno':'Nuevo turno','<div class="grid">'+field('Nombre','sf_name',s?.name)+field('Horario','sf_time',s?.time_label)+field('Aviso','sf_notice',s?.notice)+field('Capacidad','sf_cap',s?.capacity??50,'number')+'<div id="sfmsg"></div><button class="btn" id="saveShift">Guardar</button></div>');$('saveShift').onclick=async()=>{const args={p_name:$('sf_name').value.trim(),p_time_label:$('sf_time').value.trim(),p_notice:$('sf_notice').value.trim(),p_capacity:Number($('sf_cap').value)};let r=s?await db.rpc('admin_update_shift',{p_id:s.id,...args}):await db.rpc('admin_create_shift',args);if(r.error){$('sfmsg').innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}closeModal();await renderAdmin();await load()}}
async function openChange(regId,regs,allSh){const reg=regs.find(x=>x.id===regId);showModal('Cambiar turno','<div class="grid"><label>Nuevo turno<select id="newShift">'+allSh.filter(s=>s.active!==false).map(s=>'<option value="'+s.id+'" '+(s.id===reg.shift_id?'selected':'')+'>'+esc(s.name)+' — '+esc(s.time_label)+'</option>').join('')+'</select></label><button class="btn" id="saveChange">Guardar</button></div>');$('saveChange').onclick=async()=>{const r=await db.rpc('admin_manage_registration',{p_registration_id:regId,p_shift_id:Number($('newShift').value)});if(r.error)alert(r.error.message);closeModal();await renderAdmin()}}
function exportExcel(vols,regs,allSh){const rows=regs.map(r=>{const v=vols.find(x=>x.id===r.volunteer_id),s=allSh.find(x=>x.id===r.shift_id);return {'Nombre':v?.name||'', 'Congregación':v?.congregations?.name||'', 'Teléfono':v?.phone||'', 'Edad':v?.age||'', 'Turno':s?.name||'', 'Horario':s?.time_label||'', 'Fecha':new Date(r.created_at).toLocaleString('es-CO')}});const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Inscripciones');XLSX.writeFile(wb,(cfg.event_name||'voluntarios')+'.xlsx')}
