<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Supabase</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body style="font-family:system-ui;max-width:700px;margin:40px auto;padding:20px">
<h1>Prueba de conexión Supabase</h1>
<p id="status">Probando conexión…</p>
<pre id="details"></pre>
<script>
const U='https://glbeoikfovflfgldaaay.supabase.co';
const K='sb_publishable_CdNYf_mKCWC1LhR2v98YFA_F9K8q3Zg';
const db=supabase.createClient(U,K);
(async()=>{
  const out=document.getElementById('details');
  const status=document.getElementById('status');
  try{
    const r=await db.from('decisions').select('*').limit(1);
    if(r.error) throw r.error;
    status.textContent='✅ Conexión a Supabase confirmada.';
    out.textContent='Proyecto: '+U+'\nAPI accesible: sí\nConsulta de prueba: decisions → OK\nFilas recibidas: '+(r.data?.length??0);
  }catch(e){
    status.textContent='❌ La conexión o consulta falló.';
    out.textContent='Proyecto: '+U+'\nError: '+(e.message||e);
  }
})();
</script>
</body>
</html>
